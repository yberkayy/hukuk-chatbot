services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: hukuk-ai-backend:latest
    container_name: hukuk-ai-backend
    init: true
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-0.75}
      CHAT_STREAM_TIMEOUT_SECONDS: ${CHAT_STREAM_TIMEOUT_SECONDS:-90}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
      DATA_DIR: /app/data
      CHROMA_DB_DIR: /app/chroma_db
      PORT: 8000
    volumes:
      - chroma_db:/app/chroma_db
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  chroma_db:
    name: hukuk-ai-chroma-db
